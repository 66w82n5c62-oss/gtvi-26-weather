name: Publish v85 preview
on:
  push:
    paths:
      - '.github/workflows/publish-v85.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build and check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('preview-v84.html').read_text(encoding='utf-8')
          s=s.replace('<title>GTVI 26 Weather App · Mobile v84 Preview</title>','<title>GTVI 26 Weather App · Mobile v85 Preview</title>',1)
          js=r'''
<script>
(function(){
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced)return;
  const el=document.getElementById('alongHighlights');
  if(!el)return;
  let timer=null, resumeTimer=null;
  function cards(){return Array.from(el.querySelectorAll('.alongHighlight'));}
  function nearestIndex(items){
    if(!items.length)return 0;
    let best=0,dist=Infinity;
    for(let i=0;i<items.length;i++){
      const d=Math.abs(items[i].offsetLeft-el.scrollLeft);
      if(d<dist){dist=d;best=i;}
    }
    return best;
  }
  function advance(){
    const items=cards();
    if(items.length<2)return;
    const i=nearestIndex(items);
    const n=(i+1)%items.length;
    el.scrollTo({left:items[n].offsetLeft,behavior:'smooth'});
  }
  function start(){
    clearInterval(timer);
    timer=setInterval(advance,3600);
  }
  function pause(){
    clearInterval(timer);
    clearTimeout(resumeTimer);
    resumeTimer=setTimeout(start,7000);
  }
  ['touchstart','pointerdown','wheel'].forEach(evt=>el.addEventListener(evt,pause,{passive:true}));
  el.addEventListener('scrollend',()=>{}, {passive:true});
  const mo=new MutationObserver(()=>{
    el.scrollTo({left:0,behavior:'auto'});
    start();
  });
  mo.observe(el,{childList:true});
  start();
})();
</script>
'''
          if '</body>' not in s: raise SystemExit('body close not found')
          s=s.replace('</body>',js+'\n</body>',1)
          Path('preview-v85.html').write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY' > /tmp/v85-check.js
          import re
          s=open('preview-v85.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v85-check.js
          grep -q 'Mobile v85 Preview' preview-v85.html
          grep -q 'setInterval(advance,3600)' preview-v85.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' preview-v85.html
      - name: Publish preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v85.html
          git commit -m 'Publish v85 animated ride highlights preview'
          git push origin main
