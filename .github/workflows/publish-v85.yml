name: Publish v85 preview
on:
  push:
    paths:
      - '.github/workflows/publish-v85.yml'
      - '.github/v85-builder.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build and check
        run: |
          python3 .github/v85-builder.py
          python3 - <<'PY' > /tmp/v85-check.js
          import re
          s=open('preview-v85.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v85-check.js
          grep -q 'Mobile v85 Preview' preview-v85.html
          grep -q 'setInterval(advance,3600)' preview-v85.html
          grep -q "touchstart',hold" preview-v85.html
          grep -q "touchend',release" preview-v85.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' preview-v85.html
      - name: Publish preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v85.html
          git commit -m 'Publish v85 animated ride highlights preview'
          git push origin main
