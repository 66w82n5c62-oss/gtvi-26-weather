name: Apply mobile v64

on:
  push:
    paths:
      - '.github/workflows/apply-v64.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and push v64
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v64.patch
          git apply /tmp/v64.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release mobile v64'
          git push origin HEAD:main
