  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v64 patch
        shell: bash
        run: |
          cat > /tmp/v64.patch <<'PATCH'
