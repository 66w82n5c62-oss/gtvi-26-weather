name: Apply mobile v68

on:
  push:
    paths:
      - '.github/workflows/apply-v68.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v68 changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('<title>GTVI 26 Weather App · Mobile v64</title>', '<title>GTVI 26 Weather App · Mobile v68</title>'),
            ('  color:#8fa8bc;\n  text-align:center;\n}', '  color:#8fa8bc;\n  font-weight:700;\n  text-align:center;\n}'),
            ('.pointMetricLabel{\n  font-size:8px;\n  color:#7891a6;\n  text-transform:uppercase;', '.pointMetricLabel{\n  font-size:8px;\n  color:#7891a6;\n  font-weight:700;\n  text-transform:uppercase;'),
            ('.pointGust{\n  margin-top:1px;\n  font-size:8px;\n  color:#7891a6;\n  text-align:right;', '.pointGust{\n  margin-top:1px;\n  font-size:8px;\n  color:#7891a6;\n  font-weight:700;\n  text-align:right;'),
            ('.stopMeta{font-size:9px}', '.stopMeta{font-size:9px;font-weight:650}'),
            ('        <span>☀ <b id="sunStartRise">—</b></span>', '        <span><span class="sunriseWheelIcon" aria-hidden="true"></span> <b id="sunStartRise">—</b></span>'),
            ('is matched to your expected position on the route, based on your start time, riding speed and planned stops.', 'is matched to your expected position on the route based on the start time, riding speed and planned stops entered in the RIDE PLAN above.'),
            ('label:"Low forecast consensus"', 'label:"Current forecast consensus: Low"'),
            ('label:"High forecast consensus"', 'label:"Current forecast consensus: High"'),
            ('label:"Medium forecast consensus"', 'label:"Current forecast consensus: Medium"'),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected text: {old[:80]}')
            s = s.replace(old, new)

          css_anchor = '\n</style>\n</head>'
          sunrise_css = '''\n.sunriseWheelIcon{\n  display:inline-flex;\n  width:18px;\n  height:18px;\n  vertical-align:-4px;\n}\n.sunriseWheelIcon .cycleSunIcon{\n  width:18px;\n  height:18px;\n}\n'''
          if '.sunriseWheelIcon{' not in s:
            if css_anchor not in s:
              raise SystemExit('Missing style anchor')
            s = s.replace(css_anchor, sunrise_css + css_anchor, 1)

          js_anchor = 'const WICON=c=>c>=95?"⛈️":c>=80?cycleSunRainIcon():c>=61?"🌧️":c>=51?cycleSunRainIcon():c>=45?"🌫️":c===0?cycleSunIcon(false):c<=2?cycleSunIcon(true):"☁️";'
          init = '\ndocument.querySelectorAll(".sunriseWheelIcon").forEach(el=>el.innerHTML=cycleSunIcon(false));'
          if init.strip() not in s:
            if js_anchor not in s:
              raise SystemExit('Missing WICON anchor')
            s = s.replace(js_anchor, js_anchor + init, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit v68
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Release weather app mobile v68"
          git push origin main
