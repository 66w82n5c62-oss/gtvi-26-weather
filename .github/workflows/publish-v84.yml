name: Publish v84 preview
on:
  push:
    paths:
      - '.github/workflows/publish-v84.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build and check
        run: |
          python3 .github/v84-builder.py
          python3 - <<'PY' > /tmp/v84-check.js
          import re
          s=open('preview-v84.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v84-check.js
          grep -q 'Mobile v84 Preview' preview-v84.html
          grep -q 'Coldest' preview-v84.html
          grep -q 'Warmest' preview-v84.html
          grep -q 'Sunniest' preview-v84.html
          grep -q 'Windiest' preview-v84.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' preview-v84.html
      - name: Publish preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v84.html
          git commit -m 'Publish v84 scrollable ride highlights preview'
          git push origin main