name: Publish v74 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v74-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build v74 preview
        shell: bash
        run: |
          echo '' | base64 -d > build_v74.py
          python3 build_v74.py
          node --check v74-check.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v74.html
          git commit -m 'Publish v74 preview with ECMWF ensemble rain probability'
          git push origin main
