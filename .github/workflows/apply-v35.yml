name: Apply mobile v35

on:
  push:
    paths:
      - '.github/workflows/apply-v35.yml'

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove elevation threshold text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>GTVI 26 Weather App · Mobile v34</title>','<title>GTVI 26 Weather App · Mobile v35</title>',1)
          s=s.replace('    <div id="thresholds" class="thresholds"></div>\n','',1)
          line=' document.getElementById("thresholds").textContent=`Above 1,000 m: ${s.above["1000"]} km · Above 1,500 m: ${s.above["1500"]} km · Above 2,000 m: ${s.above["2000"]} km`;\n'
          s=s.replace(line,'',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove elevation threshold summary text"
          git push
