name: Apply mobile v29

on:
  push:
    paths:
      - '.github/workflows/apply-v29.yml'

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update clear-sky icon
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'const WICON=c=>c>=95?"⛈️":c>=80?"🌦️":c>=61?"🌧️":c>=51?"🌦️":c>=45?"🌫️":c===0?"☀️":c<=2?"🌤️":"☁️";'
          new = 'const WICON=c=>c>=95?"⛈️":c>=80?"🌦️":c>=61?"🌧️":c>=51?"🌦️":c>=45?"🌫️":c===0?\'<span class="clearSun">☀</span>\':c<=2?"🌤️":"☁️";'
          if old not in s:
              raise SystemExit('WICON mapping not found')
          s = s.replace(old, new, 1)
          anchor = '.wxIcon{\n  grid-column:auto!important;'
          if anchor not in s:
              raise SystemExit('wxIcon CSS anchor not found')
          s = s.replace(anchor, '.clearSun{color:#ffd84d;font-family:Arial,sans-serif;font-weight:700}\n' + anchor, 1)
          s = s.replace('<title>GTVI 26 Weather App · Mobile v28</title>', '<title>GTVI 26 Weather App · Mobile v29</title>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit app update and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v29.yml
          git add index.html
          git commit -m "Update clear-sky icon to yellow sun"
          git push
