name: Publish v72 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v72-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build full v72 preview from hosted v71
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src=Path('preview-v71.html')
          dst=Path('preview-v72.html')
          s=src.read_text()
          s=s.replace('<title>GTVI 26 Weather App · Mobile v71 Preview</title>','<title>GTVI 26 Weather App · Mobile v72 Reconciled Preview</title>',1)

          # Add Weather Along the Way highlights/status UI.
          old='''  <div class="mobileWayTitle"><strong>WEATHER ALONG THE WAY</strong> <span class="wayTimingInline">is matched to your expected position on the route based on the start time, riding speed and planned stops entered in the RIDE PLAN above.</span></div>\n\n  <div id="timeline" class="timeline"><div class="stop">Loading…</div></div>'''
          new='''  <div class="mobileWayTitle"><strong>WEATHER ALONG THE WAY</strong> <span class="wayTimingInline">is matched to your expected position on the route based on the start time, riding speed and planned stops entered in the RIDE PLAN above.</span></div>\n\n  <div id="alongHighlights" class="alongHighlights" aria-live="polite"></div>\n  <div class="alongStatusRow">\n    <div id="forecastChange" class="forecastChange"></div>\n    <div id="forecastFreshness" class="forecastFreshness"></div>\n  </div>\n\n  <div id="timeline" class="timeline"><div class="stop">Loading…</div></div>'''
          if old not in s: raise SystemExit('Along-the-way anchor missing')
          s=s.replace(old,new,1)

          css='''\n.alongHighlights{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 7px}\n.alongHighlight{min-width:0;padding:7px 8px;border:1px solid #284a65;border-radius:9px;background:#0c2236;color:#dce9f3;font-size:9px;line-height:1.25}\n.alongHighlight b{display:block;margin-bottom:2px;font-size:9px;color:#8fcdf2;text-transform:uppercase;letter-spacing:.04em}\n.alongStatusRow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:16px;margin:0 1px 8px}\n.forecastChange,.forecastFreshness{font-size:8.5px;line-height:1.2;color:#83a2b8}\n.forecastChange{font-weight:700}.forecastFreshness{text-align:right;white-space:nowrap}\n.forecastFreshness.offline{color:#ffd089;font-weight:800}\n.stop.currentRoutePoint{border-color:#6bc7f5;box-shadow:0 0 0 1px rgba(107,199,245,.2);background:#102b40}\n.routePointBadge{display:inline-block;margin-left:6px;padding:2px 5px;border-radius:999px;background:#58b7f4;color:#06101b;font-size:7px;font-weight:900;letter-spacing:.05em;vertical-align:1px}\n@media(max-width:360px){.alongHighlights{grid-template-columns:1fr}.alongStatusRow{align-items:flex-start;flex-direction:column;gap:3px}.forecastFreshness{text-align:left}}\n'''
          s=s.replace('</style>',css+'\n</style>',1)

          helpers=r'''\nconst FORECAST_STORE_PREFIX="gtvi26_forecast_v72_";\nlet lastChangeTextByStage={};\nfunction forecastStoreKey(s){return FORECAST_STORE_PREFIX+s.key}\nfunction safeStoreGet(s){try{const raw=localStorage.getItem(forecastStoreKey(s));return raw?JSON.parse(raw):null}catch(e){return null}}\nfunction safeStoreSet(s,data){try{localStorage.setItem(forecastStoreKey(s),JSON.stringify(data));return true}catch(e){return false}}\nfunction localViennaNowParts(){try{const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Vienna",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const o={};parts.forEach(p=>{if(p.type!=="literal")o[p.type]=p.value});return {date:`${o.year}-${o.month}-${o.day}`,minutes:Number(o.hour)*60+Number(o.minute)}}catch(e){const d=new Date();return {date:d.toISOString().slice(0,10),minutes:d.getHours()*60+d.getMinutes()}}}\nfunction pointArrivalMinutes(p,s){const a=arrivalInfo(p.ride_h,s,p.km);return {date:a.date,minutes:parseClock(a.time),time:a.time}}\nfunction currentRoutePointIndex(bundles,s){const now=localViennaNowParts();if(now.date!==s.date)return -1;for(let i=0;i<bundles.length;i++){const a=pointArrivalMinutes(bundles[i].p,s);if(a.date===now.date&&a.minutes>=now.minutes)return i}return -1}\nfunction bundleSummaryPoint(b,s){const rs=b.forecasts.filter(Boolean),disp=rs[0]||b.best;if(!disp)return null;const rains=rs.map(x=>x.rain).filter(Number.isFinite),precip=rs.map(x=>x.precip).filter(Number.isFinite),gusts=rs.map(x=>x.gust).filter(Number.isFinite),temps=rs.map(x=>x.temp).filter(Number.isFinite);const rainProb=Number.isFinite(b.best?.rain)?b.best.rain:(rains.length?Math.max(...rains):null);const meanPrecip=precip.length?precip.reduce((a,c)=>a+c,0)/precip.length:(Number.isFinite(disp.precip)?disp.precip:0);const gust=gusts.length?gusts.reduce((a,c)=>a+c,0)/gusts.length:(Number.isFinite(disp.gust)?disp.gust:0);const temp=temps.length?temps.reduce((a,c)=>a+c,0)/temps.length:(Number.isFinite(disp.temp)?disp.temp:null);const a=pointArrivalMinutes(b.p,s);return {km:b.p.km,time:a.time,rainProb,precip:meanPrecip,gust,temp}}\nfunction forecastSnapshot(bundles,s){const pts=bundles.map(b=>bundleSummaryPoint(b,s)).filter(Boolean);if(!pts.length)return null;const rainMax=Math.max(...pts.map(p=>Number.isFinite(p.rainProb)?p.rainProb:0)),precipMax=Math.max(...pts.map(p=>Number.isFinite(p.precip)?p.precip:0)),gustMax=Math.max(...pts.map(p=>Number.isFinite(p.gust)?p.gust:0)),temps=pts.map(p=>p.temp).filter(Number.isFinite);return {ts:Date.now(),rainMax:Math.round(rainMax),precipMax:Number(precipMax.toFixed(2)),gustMax:Math.round(gustMax),tempMin:temps.length?Math.round(Math.min(...temps)):null,tempMax:temps.length?Math.round(Math.max(...temps)):null}}\nfunction renderWorstHighlights(bundles,s){const el=document.getElementById("alongHighlights");if(!el)return;const pts=bundles.map(b=>bundleSummaryPoint(b,s)).filter(Boolean);if(!pts.length){el.innerHTML="";return}const wettest=pts.reduce((a,p)=>{const score=(Number.isFinite(p.rainProb)?p.rainProb:0)+(Number.isFinite(p.precip)?p.precip*20:0);return !a||score>a.score?{...p,score}:a},null);const gustiest=pts.reduce((a,p)=>!a||p.gust>a.gust?p:a,null);const wetDetail=(Number.isFinite(wettest.rainProb)&&wettest.rainProb>0)?`${Math.round(wettest.rainProb)}% rain`:(wettest.precip>=0.1?`${wettest.precip.toFixed(1)} mm/h`:"little rain signal");el.innerHTML=`<div class="alongHighlight"><b>Wettest</b>${wettest.time} · around ${Math.round(wettest.km)} km · ${wetDetail}</div><div class="alongHighlight"><b>Strongest gusts</b>${gustiest.time} · around ${Math.round(gustiest.km)} km · ${Math.round(gustiest.gust)} km/h</div>`}\nfunction changeText(current,previous){if(!current||!previous)return "Baseline saved for next refresh";const bits=[],rainDelta=current.rainMax-previous.rainMax,gustDelta=current.gustMax-previous.gustMax,tempMid=((current.tempMin??0)+(current.tempMax??0))/2,prevMid=((previous.tempMin??0)+(previous.tempMax??0))/2,tempDelta=tempMid-prevMid;if(Math.abs(rainDelta)>=10)bits.push(`Rain risk ${rainDelta>0?"↑":"↓"}`);else bits.push("Rain risk unchanged");if(Math.abs(gustDelta)>=5)bits.push(`Wind ${gustDelta>0?"↑":"↓"}`);else bits.push("Wind unchanged");if(Math.abs(tempDelta)>=2)bits.push(`Temperature ${tempDelta>0?"↑":"↓"}`);return bits.join(" · ")}\nfunction formatUpdatedTime(ts){try{return new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Vienna",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(ts))}catch(e){return new Date(ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}}\nfunction renderFreshness(ts,offline=false){const el=document.getElementById("forecastFreshness");if(!el)return;el.classList.toggle("offline",offline);el.textContent=ts?(offline?`Offline · Last updated ${formatUpdatedTime(ts)}`:`Updated ${formatUpdatedTime(ts)}`):""}\nfunction captureOfflineUI(s,snapshot){return {ts:snapshot?.ts||Date.now(),snapshot,outlook:document.getElementById("outlook").textContent,explain:document.getElementById("explain").textContent,agreementText:document.getElementById("agreement").textContent,agreementClass:document.getElementById("agreement").className,mTemp:document.getElementById("mTemp").textContent,mSkyIcon:document.getElementById("mSkyIcon").innerHTML,mSkySub:document.getElementById("mSkySub").textContent,mRain:document.getElementById("mRain").textContent,mRainSub:document.getElementById("mRainSub").textContent,mWind:document.getElementById("mWind").textContent,mWindSub:document.getElementById("mWindSub").textContent,ensembleRisk:document.getElementById("ensembleRisk").innerHTML,highlights:document.getElementById("alongHighlights").innerHTML,change:document.getElementById("forecastChange").textContent,timeline:document.getElementById("timeline").innerHTML}}\nfunction restoreOfflineUI(s,cached){if(!cached)return false;document.getElementById("outlook").textContent=cached.outlook||"Last saved forecast";document.getElementById("explain").textContent=cached.explain||"Showing the most recent saved forecast.";const ag=document.getElementById("agreement");ag.textContent=cached.agreementText||"Saved forecast";ag.className=cached.agreementClass||"agree medium";document.getElementById("mTemp").textContent=cached.mTemp||"—";document.getElementById("mSkyIcon").innerHTML=cached.mSkyIcon||"";document.getElementById("mSkySub").textContent=cached.mSkySub||"";document.getElementById("mRain").textContent=cached.mRain||"—";document.getElementById("mRainSub").textContent=cached.mRainSub||"";document.getElementById("mWind").textContent=cached.mWind||"—";document.getElementById("mWindSub").textContent=cached.mWindSub||"";if(cached.ensembleRisk)document.getElementById("ensembleRisk").innerHTML=cached.ensembleRisk;document.getElementById("alongHighlights").innerHTML=cached.highlights||"";document.getElementById("forecastChange").textContent=cached.change||"Showing last saved forecast";document.getElementById("timeline").innerHTML=cached.timeline||"";renderFreshness(cached.ts,true);return true}\n'''
          marker='function renderTimelineFromBundles(bundles,s){'
          if marker not in s: raise SystemExit('timeline function marker missing')
          s=s.replace(marker,helpers+'\n'+marker,1)

          timeline=r'''function renderTimelineFromBundles(bundles,s){
 const stillLoading=anyDeterministicPending(s);
 const currentIdx=currentRoutePointIndex(bundles,s);
 document.getElementById("timeline").innerHTML=bundles.map((b,idx)=>{
    const rs=b.forecasts.filter(Boolean), disp=rs[0]||b.best;
    const activeClass=idx===currentIdx?" currentRoutePoint":"";
    const badge=idx===currentIdx?`<span class="routePointBadge">NEXT</span>`:"";
    if(!disp){const status=stillLoading?"Loading forecast…":"Forecast not yet in range";return `<div class="stop${activeClass}"><div class="stopPlace">${b.p.label==="Start"?s.start:b.p.label==="Finish"?s.finish:b.p.label}${badge}</div><div class="stopMeta">${b.p.km} km · ${b.p.ele} m · ~${rideClock(b.p.ride_h,s,b.p.km)}</div><div class="risk">${status}</div></div>`;}
    const temps=rs.map(x=>x.temp).filter(Number.isFinite),meanT=temps.length?Math.round(temps.reduce((a,c)=>a+c,0)/temps.length):Math.round(disp.temp);const wetN=rs.filter(wet).length,code=rs.some(x=>x.code>=95)?95:wetN?80:disp.code;const prob=b.best?.rain;const winds=rs.map(x=>x.wind).filter(Number.isFinite),gusts=rs.map(x=>x.gust).filter(Number.isFinite);const wind=Math.round(winds.length?winds.reduce((a,c)=>a+c,0)/winds.length:0),gust=Math.round(gusts.length?gusts.reduce((a,c)=>a+c,0)/gusts.length:0);const cond=rs.some(x=>x.code>=95)?"Thunder":wetN>=2?"Rain/showers":wetN===1?"Possible shower":WDESC[code]||"Dry";const cclass=rs.some(x=>x.code>=95)?"danger":wetN>=2?"rainWet":"";
    const detail=MODELS.map(md=>{const r=b.forecasts.find(x=>x&&x.source.id===md.id);if(r)return `<div class="modelRow"><b>${md.label}</b><span>${Math.round(r.temp)}°</span><span>${r.precip.toFixed(1)} mm/h</span><span>${Math.round(r.wind)} / ${Math.round(r.gust)} km/h</span></div>`;if(isResultPending(s,md.id))return `<div class="modelRow"><b>${md.label}</b><span>…</span><span>loading…</span><span>…</span></div>`;return `<div class="modelRow"><b>${md.label}</b><span>—</span><span>not in range</span><span>—</span></div>`}).join("");
    return `<div class="stop${activeClass}"><div class="stopMain"><div><div class="stopPlace"><span class="stopName">${b.p.label==="Start"?s.start:b.p.label==="Finish"?s.finish:b.p.label}</span>${badge}</div><div class="stopMeta">${b.p.km} km · ${b.p.ele} m · ~${rideClock(b.p.ride_h,s,b.p.km)}</div></div><div class="pointWeather"><div class="pointCondition"><div class="wxIcon" aria-hidden="true">${WICON(code)}</div><div class="conditionText">${cond}</div></div><div class="pointMetrics"><div class="pointMetricRow"><span class="pointMetricLabel">Temp</span><span class="pointMetricValue">${meanT}°</span></div><div class="pointMetricRow"><span class="pointMetricLabel">Rain</span><span class="pointMetricValue ${cclass}">${prob==null?"—":Math.round(prob)+"%"}</span></div><div class="pointMetricRow"><span class="pointMetricLabel">Wind</span><span class="pointMetricValue">${wind} km/h</span></div><div class="pointGust">gust ${gust} km/h</div></div></div></div><details><summary>${b.conf.label.replace(" forecast consensus"," consensus")} · show detail</summary><div class="modelGrid">${detail}</div></details></div>`;
 }).join("");
 renderWorstHighlights(bundles,s);
}
'''
          s,n=re.subn(r'function renderTimelineFromBundles\(bundles,s\)\{.*?\n\}\nfunction renderDeterministicResults',timeline+'function renderDeterministicResults',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('timeline replacement failed')

          progressive=r'''async function fetchAllProgressive(s,force=false,onUpdate=null){
 const key=s.key;if(force){delete cache[key];delete pending[key]}getStageBucket(cache,key);getStageBucket(pending,key);if(onUpdate)onUpdate(fetchedResults(s),null);
 const coreJobs=MODELS.map(src=>fetchOne(src,s,false).then(result=>{if(onUpdate)onUpdate(fetchedResults(s),result);return result}));
 const bestJob=new Promise(resolve=>setTimeout(resolve,300)).then(()=>fetchOne(BEST,s,false)).then(result=>{if(onUpdate)onUpdate(fetchedResults(s),result);return result});
 await Promise.all([...coreJobs,bestJob]);return fetchedResults(s);
}
'''
          s,n=re.subn(r'async function fetchAllProgressive\(s,force=false,onUpdate=null\)\{.*?\n\}\nfunction usableEnsemblePayload',progressive+'function usableEnsemblePayload',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('progressive replacement failed')

          show=r'''async function showWeather(s,force,token){
 const cachedBefore=safeStoreGet(s);
 try{
   const ensembleState={resolved:false,data:null};let lastSm=null,lastError=null;
   const sunPromise=fetchSunTimes(s,force).then(data=>{if(token!==renderToken||s!==stage())return null;if(data)renderSunTimes(data,s);return data}).catch(()=>null);
   const ensemblePromise=new Promise(resolve=>setTimeout(resolve,450)).then(()=>fetchEnsemble(s,force)).then(data=>{ensembleState.resolved=true;ensembleState.data=data;if(token!==renderToken||s!==stage())return data;if(lastSm)renderEnsembleRisk(ensembleStageRisk(data,s),lastSm.gmax);return data}).catch(()=>{ensembleState.resolved=true;ensembleState.data=null;if(token!==renderToken||s!==stage())return null;if(lastSm)renderEnsembleRisk(null,lastSm.gmax);return null});
   const deterministicPromise=fetchAllProgressive(s,force,(results)=>{const rendered=renderDeterministicResults(results,s,token,ensembleState);if(rendered.sm)lastSm=rendered.sm;if(rendered.error)lastError=rendered.error});
   const finalResults=await deterministicPromise;if(token!==renderToken||s!==stage())return;const finalRendered=renderDeterministicResults(finalResults,s,token,ensembleState);if(finalRendered.sm)lastSm=finalRendered.sm;if(finalRendered.error)lastError=finalRendered.error;
   await Promise.allSettled([sunPromise,ensemblePromise]);if(token!==renderToken||s!==stage())return;if(!lastSm)throw(lastError||new Error("Forecast not yet available"));
   const finalBundles=buildBundlesFromResults(finalResults,s,false),snap=forecastSnapshot(finalBundles,s);if(snap){let change="";if(force){change=changeText(snap,cachedBefore?.snapshot||null);lastChangeTextByStage[s.key]=change}else{change=lastChangeTextByStage[s.key]||cachedBefore?.change||""}document.getElementById("forecastChange").textContent=change;renderFreshness(snap.ts,false);const cached=captureOfflineUI(s,snap);cached.change=change;safeStoreSet(s,cached)}
 }catch(e){if(token!==renderToken||s!==stage())return;if(restoreOfflineUI(s,cachedBefore))return;document.getElementById("timeline").innerHTML=`<div class="error">${e.message} Try Refresh if this persists.</div>`;document.getElementById("outlook").textContent="Forecast not yet available";document.getElementById("explain").textContent="The route remains available; live weather needs internet access and a model horizon that reaches this date.";document.getElementById("agreement").className="agree low";document.getElementById("agreement").textContent="NOT IN RANGE";document.getElementById("forecastChange").textContent="";renderFreshness(null,false)}
}
'''
          s,n=re.subn(r'async function showWeather\(s,force,token\)\{.*?\n\}\nfunction initMap',show+'function initMap',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('showWeather replacement failed')

          render=r'''async function render(force=false){
 const token=++renderToken;buildDays();const s=stage();baseUI(s);drawProfile(s);if(document.getElementById("routeDetails").open)drawRoute(s);
 const cached=safeStoreGet(s);if(cached){restoreOfflineUI(s,cached);const fresh=document.getElementById("forecastFreshness");if(fresh){fresh.classList.remove("offline");fresh.textContent=`Updating… · Last updated ${formatUpdatedTime(cached.ts)}`}}
 await showWeather(s,force,token);
}
'''
          s,n=re.subn(r'async function render\(force=false\)\{.*?\n\}\n\n\nfunction changeStop',render+'\n\nfunction changeStop',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('render replacement failed')

          hook='''window.addEventListener("offline",()=>{const s=stage(),cached=safeStoreGet(s);if(cached)restoreOfflineUI(s,cached)});\nwindow.addEventListener("online",()=>{const el=document.getElementById("forecastFreshness");if(el&&el.classList.contains("offline"))el.textContent+=" · tap Refresh"});\n'''
          anchor='document.getElementById("routeDetails").addEventListener("toggle",()=>{if(document.getElementById("routeDetails").open)drawRoute(stage())});'
          if anchor not in s: raise SystemExit('event hook anchor missing')
          s=s.replace(anchor,hook+anchor,1)

          required=['Mobile v72 Reconciled Preview','id="alongHighlights"','id="forecastChange"','id="forecastFreshness"','currentRoutePointIndex','renderWorstHighlights','restoreOfflineUI','safeStoreGet','Updating… · Last updated','Current forecast consensus:','entered in the RIDE PLAN above','sunriseWheelIcon']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing v72 features: '+repr(missing))
          dst.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v72.html
          git commit -m 'Publish full v72 reconciled preview page'
          git push origin main
