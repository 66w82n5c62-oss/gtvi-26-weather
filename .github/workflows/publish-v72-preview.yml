name: Publish v72 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v72-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build preview-v72.html
        run: python3 .github/scripts/build_v72.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('preview-v72.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/v72.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/v72.js
      - name: Commit preview page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v72.html
          git commit -m 'Publish full v72 reconciled preview page'
          git push origin main
