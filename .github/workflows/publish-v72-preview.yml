name: Publish v72 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v72-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish reconciled v72 preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('preview-v71.html')
          dst=Path('preview-v72.html')
          s=src.read_text()

          old='<title>GTVI 26 Weather App · Mobile v71 Preview</title>'
          new='<title>GTVI 26 Weather App · Mobile v72 Reconciled Preview</title>'
          if old not in s:
              raise SystemExit('Expected v71 preview title not found')
          s=s.replace(old,new,1)

          required=[
              'sunriseWheelIcon',
              'Current forecast consensus:',
              'entered in the RIDE PLAN above',
              'id="alongHighlights"',
              'id="forecastChange"',
              'id="forecastFreshness"',
              'currentRoutePointIndex',
              'restoreOfflineUI',
              'safeStoreGet',
              'renderWorstHighlights',
              'Updating… · Last updated'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing expected reconciled features: '+repr(missing))

          dst.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v72.html
          git commit -m 'Publish v72 reconciled preview page'
          git push origin main
