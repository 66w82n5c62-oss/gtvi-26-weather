name: Apply v38 header text

on:
  push:
    paths:
      - '.github/workflows/apply-v38.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update header and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Route weather · 12–18 Sep 2026', 'Live route forecasts · 12–18 Sep 2026', 1)
          s = s.replace('Mobile v37</title>', 'Mobile v38</title>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update live forecast header to v38"
          git push
