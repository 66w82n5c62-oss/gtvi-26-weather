name: Publish v81 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v81.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build v81 preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          s=s.replace('<title>GTVI 26 Weather App · Mobile v80</title>','<title>GTVI 26 Weather App · Mobile v81 Preview</title>',1)
          old='''.mobileTimeInput,.mobileControlValue{\n  width:100%;\n  min-width:0;\n  height:34px;\n  box-sizing:border-box;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  text-align:center;\n  background:#0c1c2c;\n  color:#fff;\n  -webkit-text-fill-color:#fff;\n  border:1px solid #2d4a64;\n  border-radius:8px;\n  padding:0 4px;\n  font-size:12px;'''
          new='''.mobileTimeInput,.mobileControlValue{\n  width:100%;\n  min-width:0;\n  height:34px;\n  box-sizing:border-box;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  text-align:center;\n  background:#0c1c2c;\n  color:#fff;\n  -webkit-text-fill-color:#fff;\n  border:1px solid #2d4a64;\n  border-radius:8px;\n  padding:0 4px;\n  font-size:11px;'''
          if old not in s: raise SystemExit('mobile time/control font block not found')
          s=s.replace(old,new,1)
          Path('preview-v81.html').write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY' > /tmp/v81-check.js
          import re
          s=open('preview-v81.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v81-check.js
          grep -q 'Mobile v81 Preview' preview-v81.html
          grep -q 'font-size:11px' preview-v81.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' preview-v81.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v81.html
          git commit -m 'Publish v81 smaller Wheels Rolling time preview'
          git push origin main
