name: Publish v77 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v77-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build v77 preview from v75
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('preview-v75.html').read_text()
          s=s.replace('<title>GTVI 26 Weather App · Mobile v75 Preview</title>','<title>GTVI 26 Weather App · Mobile v77 Preview</title>',1)
          reps={
            '--muted:#a6b9ca;':'--muted:#bac9d6;',
            'color:#7891a6':'color:#94a9ba','color:#7f98ad':'color:#9bb0c0','color:#839aaf':'color:#9dafbf',
            'color:#8199ae':'color:#9eb1c0','color:#8ca5ba':'color:#a8bac8','color:#8fa7bb':'color:#aabcca',
            'color:#8fa8bc':'color:#aabcca','color:#93aac0':'color:#aec0cd','color:#9fb4c6':'color:#b9c8d3',
            'color:#a8bdce':'color:#bdcbd6','color:#a9bfd2':'color:#bfced9','color:#a9c4dc':'color:#bfd4e5'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          css='''\n/* v76: slightly brighter secondary text for improved mobile readability */\n.date,\n.metricSub,\n.timeHint,\n.breakSub,\n.breakSummary,\n.consensusHint,\n.mobileWayTitle .wayTimingInline,\n.mobileSunCompact,\n.mobilePlanNote,\n.stopMeta,\n.pointMetricLabel,\n.pointGust,\n.aboutForecastBody,\n.aboutForecastFoot{\n  filter:brightness(1.08);\n}\n'''
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('    `<div class="alongHighlight"><b>Strongest gusts</b>${gustiest.time} · around ${Math.round(gustiest.km)} km · ${Math.round(gustiest.gust)} km/h</div>`;','    ``;',1)
          anchor='function renderTimelineFromBundles(bundles,s,ensembleData=null){'
          helpers='''function bearingDeg(a,b){\n  const toRad=x=>x*Math.PI/180, toDeg=x=>x*180/Math.PI;\n  const p1=toRad(a.lat), p2=toRad(b.lat), dl=toRad(b.lon-a.lon);\n  const y=Math.sin(dl)*Math.cos(p2);\n  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);\n  return (toDeg(Math.atan2(y,x))+360)%360;\n}\nfunction routeBearingAtKm(s,km){\n  const line=s.line||[];\n  if(line.length<2)return null;\n  let idx=line.findIndex(p=>p.km>=km);\n  if(idx<=0)idx=1;\n  if(idx>=line.length)idx=line.length-1;\n  return bearingDeg(line[idx-1],line[idx]);\n}\nfunction circularMeanDeg(vals){\n  const v=vals.filter(Number.isFinite);\n  if(!v.length)return null;\n  const sy=v.reduce((a,d)=>a+Math.sin(d*Math.PI/180),0);\n  const sx=v.reduce((a,d)=>a+Math.cos(d*Math.PI/180),0);\n  return (Math.atan2(sy,sx)*180/Math.PI+360)%360;\n}\nfunction windEffectLabel(routeBearing,windFrom,windSpeed){\n  if(!Number.isFinite(routeBearing)||!Number.isFinite(windFrom)||!Number.isFinite(windSpeed))return null;\n  if(windSpeed<4)return {label:\"Light / little effect\",along:0,cross:windSpeed};\n  const windTo=(windFrom+180)%360;\n  const diff=((windTo-routeBearing+540)%360)-180;\n  const along=windSpeed*Math.cos(diff*Math.PI/180);\n  const cross=Math.abs(windSpeed*Math.sin(diff*Math.PI/180));\n  const frac=along/windSpeed;\n  let label=\"Crosswind\";\n  if(frac>=0.70)label=\"Tailwind\";\n  else if(frac>=0.20)label=\"Cross-tailwind\";\n  else if(frac<=-0.70)label=\"Headwind\";\n  else if(frac<=-0.20)label=\"Cross-headwind\";\n  return {label,along,cross};\n}\n\n'''
          if anchor not in s: raise SystemExit('timeline anchor missing')
          s=s.replace(anchor,helpers+anchor,1)
          old='''    const winds=rs.map(x=>x.wind).filter(Number.isFinite);\n    const gusts=rs.map(x=>x.gust).filter(Number.isFinite);\n    const wind=Math.round(winds.length?winds.reduce((a,c)=>a+c,0)/winds.length:0);\n    const gust=Math.round(gusts.length?gusts.reduce((a,c)=>a+c,0)/gusts.length:0);'''
          new='''    const winds=rs.map(x=>x.wind).filter(Number.isFinite);\n    const gusts=rs.map(x=>x.gust).filter(Number.isFinite);\n    const windDirs=rs.map(x=>x.wdir).filter(Number.isFinite);\n    const wind=Math.round(winds.length?winds.reduce((a,c)=>a+c,0)/winds.length:0);\n    const gust=Math.round(gusts.length?gusts.reduce((a,c)=>a+c,0)/gusts.length:0);\n    const meanWindDir=circularMeanDeg(windDirs);\n    const routeBearing=routeBearingAtKm(s,b.p.km);\n    const windEffect=windEffectLabel(routeBearing,meanWindDir,wind);'''
          if old not in s: raise SystemExit('wind block missing')
          s=s.replace(old,new,1)
          old2='<div class="pointGust">gust ${gust} km/h</div>'
          new2='<div class="pointGust">gust ${gust} km/h</div>${windEffect?`<div class="pointGust">${windEffect.label}</div>`:""}'
          if old2 not in s: raise SystemExit('gust line missing')
          s=s.replace(old2,new2,1)
          about='<li><b>Weather along the way</b> is matched to your expected position on the route based on the start time, riding speed and planned stops entered in the RIDE PLAN above.</li>'
          s=s.replace(about,about+'\n      <li><b>Wind effect</b> compares forecast wind direction with the actual route bearing at each point, showing tailwind, cross-tailwind, crosswind, cross-headwind or headwind.</li>',1)
          Path('preview-v77.html').write_text(s)
          PY
          python3 - <<'PY' > v77-check.js
          import re
          s=open('preview-v77.html').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check v77-check.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v77.html
          git commit -m 'Publish hosted v77 preview'
          git push origin main
