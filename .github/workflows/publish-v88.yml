name: Publish v88 preview
on:
  push:
    paths:
      - '.github/workflows/publish-v88.yml'
      - '.github/v88-builder.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build and check
        run: |
          python3 .github/v88-builder.py
          python3 - <<'PY' > /tmp/v88-check.js
          import re
          s=open('preview-v88.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v88-check.js
          grep -q 'Mobile v88 Preview' preview-v88.html
          grep -q 'rainIntensityIcon' preview-v88.html
          grep -q 'c===82?rainIntensityIcon(true,3)' preview-v88.html
          grep -q 'c>=65?rainIntensityIcon(false,3)' preview-v88.html
          grep -q 'font-size:10px' preview-v88.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' preview-v88.html
      - name: Publish preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v88.html
          if git diff --cached --quiet; then
            echo 'preview-v88.html already current'
          else
            git commit -m 'Publish v88 graduated rain icons preview'
            git push origin main
          fi
