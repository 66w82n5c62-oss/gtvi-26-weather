name: Publish v86 live
on:
  push:
    paths:
      - '.github/workflows/publish-live-v86.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote v86 and check
        run: |
          cp preview-v86.html index.html
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          s=s.replace('<title>GTVI 26 Weather App · Mobile v86 Preview</title>','<title>GTVI 26 Weather App · Mobile v86</title>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          python3 - <<'PY' > /tmp/v86-live-check.js
          import re
          s=open('index.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v86-live-check.js
          grep -q 'Mobile v86</title>' index.html
          grep -q 'consensusRainProbability' index.html
          grep -q 'pointWindEffect' index.html
          grep -q 'Sunshine' index.html
          grep -q 'Windiest' index.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' index.html
      - name: Publish live
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Promote mobile v86 to live'
          git push origin main
