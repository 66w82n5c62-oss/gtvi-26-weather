name: Apply mobile v49

on:
  push:
    paths:
      - '.github/workflows/apply-v49.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v49 transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing: {label}')
              s=s.replace(old,new,1)

          rep('<title>GTVI 26 Weather App · Mobile v38</title>','<title>GTVI 26 Weather App · Mobile v49</title>','title')
          s=re.sub(r'\.appTitleCycling\{.*?\.titleBike\{.*?\n\}', '', s, count=1, flags=re.S)
          rep('''<div class="appTitle appTitleCycling">
            <svg class="titleBike" viewBox="0 0 64 36" aria-hidden="true">
              <circle cx="14" cy="25" r="8"></circle>
              <circle cx="50" cy="25" r="8"></circle>
              <path d="M14 25 L25 10 L34 25 L20 25 L28 14 L40 14 L50 25"></path>
              <path d="M25 10 L21 7 M40 14 L44 8 M42 8 L48 8"></path>
            </svg>
            <span>GTVI 26 Weather App</span>
            <span style="font-size:11px;color:#7891a6;font-weight:700">Mobile</span>
          </div>''','''<div class="appTitle">GTVI 26 Weather App <span style="font-size:11px;color:#7891a6;font-weight:700">Mobile</span></div>''','title html')

          old_css=re.search(r'\.wxClear,\.wxMostlyClear\{.*?\.wxCloudPuff\{.*?\n\}',s,re.S)
          if not old_css: raise SystemExit('missing: old weather icon css')
          new_css='''.cycleSunIcon{
            width:30px;
            height:30px;
            display:block;
            overflow:visible;
          }
          .cycleSunIcon .cycleRim{
            fill:none;
            stroke:#ffd84d;
            stroke-width:2.45;
          }
          .cycleSunIcon .cycleSpokes line{
            stroke:#ffd84d;
            stroke-width:.9;
            stroke-linecap:round;
          }
          .cycleSunIcon .cycleHub{
            fill:#ffd84d;
            stroke:#f4b500;
            stroke-width:.7;
          }
          .cycleSunIcon .cycleRays path{
            fill:#ffd84d;
            stroke:none;
          }
          .cycleSunIcon .cycleCloud ellipse,
          .cycleSunIcon .cycleCloud rect{
            fill:#e8f1f8;
            stroke:#c4d2de;
            stroke-width:.6;
          }
          .cycleSunIcon.hasCloud{
            width:32px;
            height:32px;
          }
          .rainAmountIcon{
            width:32px;
            height:30px;
            display:block;
          }
          .rainAmountIcon .rainCloud ellipse,
          .rainAmountIcon .rainCloud rect{
            fill:#dce7ef;
            stroke:#b9c9d6;
            stroke-width:.7;
          }
          .rainAmountIcon .rainDrop{fill:#58b7f4}
          .rainAmountIcon.rain-none .rainCloud{opacity:.72}
          .rainAmountIcon.rain-light .rainDrop{opacity:.78}'''
          s=s[:old_css.start()]+new_css+s[old_css.end():]

          rep('<div class="weatherGlyph" aria-hidden="true">🌧️</div>','<div class="weatherGlyph" id="mRainIcon" aria-hidden="true">☁️</div>','rain card icon')

          old_wicon='''const WICON=c=>c>=95?"⛈️":c>=80?"🌦️":c>=61?"🌧️":c>=51?"🌦️":c>=45?"🌫️":c===0?'<span class="wxClear"><span class="wxSunDisc"></span></span>':c<=2?'<span class="wxMostlyClear"><span class="wxSunDisc"></span><span class="wxCloudPuff"></span></span>':"☁️";'''
          new_wicon='''function cycleSunIcon(withCloud=false){
           const rayAngles=[0,45,90,135,180,225,270,315];
           const rays=rayAngles.map(deg=>{
             const a=deg*Math.PI/180;
             const base=18.7,tip=24.6,halfWidth=2.75;
             const bx=24+base*Math.cos(a),by=24+base*Math.sin(a);
             const tx=24+tip*Math.cos(a),ty=24+tip*Math.sin(a);
             const px=halfWidth*Math.sin(a),py=halfWidth*Math.cos(a);
             return `<path d="M ${(bx-px).toFixed(1)} ${(by+py).toFixed(1)} L ${(bx+px).toFixed(1)} ${(by-py).toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)} Z"/>`;
           }).join("");
           const spokes=Array.from({length:12},(_,i)=>{
             const a=(Math.PI*2*i/12),x=24+12.7*Math.cos(a),y=24+12.7*Math.sin(a);
             return `<line x1="24" y1="24" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
           }).join("");
           const cloud=withCloud?`<g class="cycleCloud">
             <ellipse cx="34" cy="31.5" rx="8" ry="5.2"/>
             <ellipse cx="28.5" cy="32.5" rx="6.5" ry="4.4"/>
             <ellipse cx="39.5" cy="33" rx="6.2" ry="4.1"/>
             <rect x="24" y="31" width="22" height="6" rx="3"/>
           </g>`:"";
           return `<svg class="cycleSunIcon${withCloud?" hasCloud":""}" viewBox="0 0 48 48" aria-hidden="true">
             <g class="cycleRays">${rays}</g>
             <circle class="cycleRim" cx="24" cy="24" r="14"/>
             <g class="cycleSpokes">${spokes}</g>
             <circle class="cycleHub" cx="24" cy="24" r="2.2"/>
             ${cloud}
           </svg>`;
          }
          const WICON=c=>c>=95?"⛈️":c>=80?"🌦️":c>=61?"🌧️":c>=51?"🌦️":c>=45?"🌫️":c===0?cycleSunIcon(false):c<=2?cycleSunIcon(true):"☁️";'''
          rep(old_wicon,new_wicon,'WICON')

          rep('if(!codes.length)return {icon:"⛅",label:"Sun / cloud uncertain"};','if(!codes.length)return {icon:cycleSunIcon(true),label:"Sun / cloud uncertain"};','sky uncertain')
          rep('if(avg<0.65)return {icon:"☀️",label:"Mostly sunny"};','if(avg<0.65)return {icon:cycleSunIcon(false),label:"Mostly sunny"};','sky sunny')
          rep('if(avg<1.45)return {icon:"🌤️",label:"Sunny intervals"};','if(avg<1.45)return {icon:cycleSunIcon(true),label:"Sunny intervals"};','sky intervals')
          rep('if(avg<2.35)return {icon:"⛅",label:"Sun and cloud"};','if(avg<2.35)return {icon:cycleSunIcon(true),label:"Sun and cloud"};','sky suncloud')

          anchor='function renderEnsembleRisk(risk,deterministicMax=null){'
          helper='''function rainAmountIcon(level="none"){
           const drops=level==="heavy"?3:level==="moderate"?2:level==="light"?1:0;
           const dropXs=drops===3?[18,24,30]:drops===2?[20,28]:drops===1?[24]:[];
           const rain=dropXs.map(x=>`<path class="rainDrop" d="M ${x} 29 C ${x-1.8} 32 ${x-1.8} 34 ${x} 35.5 C ${x+1.8} 34 ${x+1.8} 32 ${x} 29 Z"/>`).join("");
           return `<svg class="rainAmountIcon rain-${level}" viewBox="0 0 48 44" aria-hidden="true"><g class="rainCloud"><ellipse cx="20" cy="22" rx="9" ry="6"/><ellipse cx="28" cy="19" rx="8" ry="7"/><ellipse cx="34" cy="23" rx="7" ry="5"/><rect x="13" y="21" width="28" height="7" rx="3.5"/></g>${rain}</svg>`;
          }
          function setRainAmountIcon(risk=null,deterministicPhrase=""){
           const el=document.getElementById("mRainIcon");
           if(!el)return;
           let level="none";
           if(risk){
             if((risk.rainHeavy??0)>=35 || (risk.precipP90??0)>=2)level="heavy";
             else if((risk.rainModerate??0)>=35 || (risk.precipP90??0)>=1)level="moderate";
             else if((risk.rainAny??0)>=20 || (risk.precipP90??0)>=0.2)level="light";
           }else{
             const p=(deterministicPhrase||"").toLowerCase();
             if(p.includes("thunder")||p.includes("periods of rain")||p.includes("wet"))level="moderate";
             else if(p.includes("shower"))level="light";
           }
           el.innerHTML=rainAmountIcon(level);
          }
          '''
          rep(anchor,helper+anchor,'rain helper anchor')
          rep('function renderEnsembleRisk(risk,deterministicMax=null){\n const box=document.getElementById("ensembleRisk");','function renderEnsembleRisk(risk,deterministicMax=null){\n const box=document.getElementById("ensembleRisk");\n setRainAmountIcon(risk,document.getElementById("outlook")?.textContent||"");','ensemble rain icon')
          rep('document.getElementById("mTemp").textContent="—";document.getElementById("mRain").textContent="—";document.getElementById("mWind").textContent="—";','document.getElementById("mTemp").textContent="—";document.getElementById("mRain").textContent="—";document.getElementById("mWind").textContent="—";document.getElementById("mRainIcon").innerHTML=rainAmountIcon("none");','baseUI rain reset')
          rep('document.getElementById("outlook").textContent=sm.phrase;','document.getElementById("outlook").textContent=sm.phrase;\n setRainAmountIcon(null,sm.phrase);','deterministic rain icon')
          s=s.replace(' · show forecast detail',' · show detail')

          p.write_text(s,encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S))
          Path('/tmp/app.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit v49
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Release weather app mobile v49"
          git push origin HEAD:main
