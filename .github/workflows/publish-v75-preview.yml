name: Publish v75 preview

on:
  push:
    paths:
      - '.github/workflows/publish-v75-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build v75 preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('preview-v74.html').read_text()
          s=s.replace('<title>GTVI 26 Weather App · Mobile v74 Preview</title>','<title>GTVI 26 Weather App · Mobile v75 Preview</title>',1)
          old='.modelRow{display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:7px;font-size:11px;background:#0c1c2c;padding:7px;border-radius:8px;color:#c3d1dc}'
          new='.modelRow{display:grid;grid-template-columns:58px 42px minmax(118px,1.45fr) minmax(104px,1fr);gap:5px;font-size:11px;background:#0c1c2c;padding:7px;border-radius:8px;color:#c3d1dc}\n.modelRow > span:nth-child(3){white-space:nowrap}'
          if old not in s: raise SystemExit('modelRow block missing')
          s=s.replace(old,new,1)
          Path('preview-v75.html').write_text(s)
          PY
          python3 - <<'PY' > v75-check.js
          import re
          s=open('preview-v75.html').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check v75-check.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v75.html
          git commit -m 'Publish v75 preview with tighter rain column'
          git push origin main
