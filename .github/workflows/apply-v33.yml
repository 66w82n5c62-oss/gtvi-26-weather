name: Apply mobile v33

on:
  push:
    paths:
      - '.github/workflows/apply-v33.yml'

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release file
        run: curl -L 'https://raw.githubusercontent.com/66w82n5c62-oss/gtvi-26-weather/main/index.html' -o /tmp/current.html
      - name: Apply v33 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>GTVI 26 Weather App · Mobile v29</title>','<title>GTVI 26 Weather App · Mobile v33</title>',1)
          s=s.replace('.mobileStops{display:flex;flex-direction:column;gap:6px}', '''.appTitleCycling{\n  display:flex;\n  align-items:center;\n  gap:7px;\n}\n.titleBike{\n  width:28px;\n  height:18px;\n  flex:0 0 auto;\n  stroke:#58b7f4;\n  stroke-width:2.4;\n  fill:none;\n  stroke-linecap:round;\n  stroke-linejoin:round;\n}\n.mobileStopField{\n  min-width:0;\n}\n.mobileStopFieldLabel{\n  margin:0 0 4px 2px;\n  font-size:8px;\n  line-height:1;\n  text-transform:uppercase;\n  letter-spacing:.06em;\n  font-weight:800;\n  color:#829caf;\n}\n.mobileStopFieldLabel span{\n  text-transform:none;\n  letter-spacing:0;\n  font-weight:700;\n}\n.mobileStops{display:flex;flex-direction:column;gap:6px}''',1)
          s=s.replace('.clearSun{color:#ffd84d;font-family:Arial,sans-serif;font-weight:700}', '''.wxClear,.wxMostlyClear{\n  position:relative;\n  display:inline-block;\n  width:28px;\n  height:28px;\n  vertical-align:middle;\n}\n.wxSunDisc{\n  position:absolute;\n  left:7px;\n  top:7px;\n  width:14px;\n  height:14px;\n  border-radius:50%;\n  background:#ffd84d;\n  box-shadow:\n    0 -10px 0 -6px #ffd84d,\n    0 10px 0 -6px #ffd84d,\n    10px 0 0 -6px #ffd84d,\n    -10px 0 0 -6px #ffd84d,\n    7px 7px 0 -6px #ffd84d,\n    -7px -7px 0 -6px #ffd84d,\n    7px -7px 0 -6px #ffd84d,\n    -7px 7px 0 -6px #ffd84d;\n}\n.wxCloudPuff{\n  position:absolute;\n  right:1px;\n  bottom:3px;\n  width:15px;\n  height:8px;\n  border-radius:8px;\n  background:#e8f1f8;\n  box-shadow:\n    -5px 1px 0 1px #e8f1f8,\n    -1px -4px 0 -1px #e8f1f8;\n  border:1px solid rgba(8,21,34,.22);\n}''',1)
          s=s.replace('  .mobileStopName{font-size:10px}\n  .mobileStopCtl','  .mobileStopName{font-size:10px}\n  .mobileStopFieldLabel{font-size:7.5px}\n  .mobileStopCtl',1)
          s=s.replace('<div class="appTitle">GTVI 26 Weather App <span style="font-size:11px;color:#7891a6;font-weight:700">Mobile</span></div>', '''<div class="appTitle appTitleCycling">\n  <svg class="titleBike" viewBox="0 0 64 36" aria-hidden="true">\n    <circle cx="14" cy="25" r="8"></circle>\n    <circle cx="50" cy="25" r="8"></circle>\n    <path d="M14 25 L25 10 L34 25 L20 25 L28 14 L40 14 L50 25"></path>\n    <path d="M25 10 L21 7 M40 14 L44 8 M42 8 L48 8"></path>\n  </svg>\n  <span>GTVI 26 Weather App</span>\n  <span style="font-size:11px;color:#7891a6;font-weight:700">Mobile</span>\n</div>''',1)
          s=s.replace('<summary>Range of possibilities</summary>','<summary>Forecast spread</summary>',1)
          s=s.replace('<b>Range of possibilities</b> shows the broader spread of likely conditions, using ensemble forecasting to highlight uncertainty.','<b>Forecast spread</b> shows the broader spread of likely conditions, using ensemble forecasting to highlight uncertainty.',1)
          # Ride plan control markup
          s=s.replace('''        <div class="mobileStopCtl">\n          <span class="mobileTiny">at</span>\n          <button class="miniBtn" type="button" data-stop="morning" data-field="km" data-delta="-5">‹</button>\n          <div class="miniValue" id="morningKm">—</div>\n          <button class="miniBtn" type="button" data-stop="morning" data-field="km" data-delta="5">›</button>\n        </div>\n        <div class="mobileStopCtl">\n          <button class="miniBtn" type="button" data-stop="morning" data-field="min" data-delta="-5">‹</button>\n          <div class="miniValue" id="morningMin">—</div>\n          <button class="miniBtn" type="button" data-stop="morning" data-field="min" data-delta="5">›</button>\n        </div>''','''        <div class="mobileStopField">\n          <div class="mobileStopFieldLabel">At</div>\n          <div class="mobileStopCtl">\n            <button class="miniBtn" type="button" data-stop="morning" data-field="km" data-delta="-5">‹</button>\n            <div class="miniValue" id="morningKm">—</div>\n            <button class="miniBtn" type="button" data-stop="morning" data-field="km" data-delta="5">›</button>\n          </div>\n        </div>\n        <div class="mobileStopField">\n          <div class="mobileStopFieldLabel">For</div>\n          <div class="mobileStopCtl">\n            <button class="miniBtn" type="button" data-stop="morning" data-field="min" data-delta="-5">‹</button>\n            <div class="miniValue" id="morningMin">—</div>\n            <button class="miniBtn" type="button" data-stop="morning" data-field="min" data-delta="5">›</button>\n          </div>\n        </div>''',1)
          s=s.replace('''        <div class="mobileStopCtl">\n          <span class="mobileTiny" id="lunchAtLabel">Distance</span>\n          <button class="miniBtn" type="button" data-lunch-at="-1">‹</button>\n          <div class="miniValue" id="lunchKm">—</div>\n          <button class="miniBtn" type="button" data-lunch-at="1">›</button>\n        </div>\n        <div class="mobileStopCtl">\n          <button class="miniBtn" type="button" data-stop="lunch" data-field="min" data-delta="-5">‹</button>\n          <div class="miniValue" id="lunchMin">—</div>\n          <button class="miniBtn" type="button" data-stop="lunch" data-field="min" data-delta="5">›</button>\n        </div>''','''        <div class="mobileStopField">\n          <div class="mobileStopFieldLabel">At <span id="lunchAtLabel">distance</span></div>\n          <div class="mobileStopCtl">\n            <button class="miniBtn" type="button" data-lunch-at="-1">‹</button>\n            <div class="miniValue" id="lunchKm">—</div>\n            <button class="miniBtn" type="button" data-lunch-at="1">›</button>\n          </div>\n        </div>\n        <div class="mobileStopField">\n          <div class="mobileStopFieldLabel">For</div>\n          <div class="mobileStopCtl">\n            <button class="miniBtn" type="button" data-stop="lunch" data-field="min" data-delta="-5">‹</button>\n            <div class="miniValue" id="lunchMin">—</div>\n            <button class="miniBtn" type="button" data-stop="lunch" data-field="min" data-delta="5">›</button>\n          </div>\n        </div>''',1)
          s=s.replace('''        <div class="mobileStopCtl">\n          <span class="mobileTiny">at</span>\n          <button class="miniBtn" type="button" data-stop="afternoon" data-field="km" data-delta="-5">‹</button>\n          <div class="miniValue" id="afternoonKm">—</div>\n          <button class="miniBtn" type="button" data-stop="afternoon" data-field="km" data-delta="5">›</button>\n        </div>\n        <div class="mobileStopCtl">\n          <button class="miniBtn" type="button" data-stop="afternoon" data-field="min" data-delta="-5">‹</button>\n          <div class="miniValue" id="afternoonMin">—</div>\n          <button class="miniBtn" type="button" data-stop="afternoon" data-field="min" data-delta="5">›</button>\n        </div>''','''        <div class="mobileStopField">\n          <div class="mobileStopFieldLabel">At</div>\n          <div class="mobileStopCtl">\n            <button class="miniBtn" type="button" data-stop="afternoon" data-field="km" data-delta="-5">‹</button>\n            <div class="miniValue" id="afternoonKm">—</div>\n            <button class="miniBtn" type="button" data-stop="afternoon" data-field="km" data-delta="5">›</button>\n          </div>\n        </div>\n        <div class="mobileStopField">\n          <div class="mobileStopFieldLabel">For</div>\n          <div class="mobileStopCtl">\n            <button class="miniBtn" type="button" data-stop="afternoon" data-field="min" data-delta="-5">‹</button>\n            <div class="miniValue" id="afternoonMin">—</div>\n            <button class="miniBtn" type="button" data-stop="afternoon" data-field="min" data-delta="5">›</button>\n          </div>\n        </div>''',1)
          s=s.replace('document.getElementById("lunchAtLabel").textContent=st.lunch.mode==="time"?"Lunch time":"Distance from start";','document.getElementById("lunchAtLabel").textContent=st.lunch.mode==="time"?"time":"distance";',1)
          # Weather icon consistency
          s=s.replace('const WICON=c=>c>=95?"⛈️":c>=80?"🌦️":c>=61?"🌧️":c>=51?"🌦️":c>=45?"🌫️":c===0?\'<span class="clearSun">☀</span>\':c<=2?"🌤️":"☁️";','const WICON=c=>c>=95?"⛈️":c>=80?"🌦️":c>=61?"🌧️":c>=51?"🌦️":c>=45?"🌫️":c===0?\'<span class="wxClear"><span class="wxSunDisc"></span></span>\':c<=2?\'<span class="wxMostlyClear"><span class="wxSunDisc"></span><span class="wxCloudPuff"></span></span>\':"☁️";',1)
          # Progressive deterministic loading helpers
          old='''async function fetchAll(s,force=false){\n const key=s.key;\n if(force){delete cache[key];delete pending[key]}\n if(cache[key])return cache[key];\n if(pending[key])return pending[key];\n pending[key]=Promise.all([...MODELS,BEST].map(src=>\n   fetchSource(src,s).then(data=>({src,data,ok:true})).catch(error=>({src,error,ok:false}))\n )).then(results=>{\n   cache[key]=results;delete pending[key];return results;\n }).catch(e=>{delete pending[key];throw e});\n return pending[key];\n}'''
          new='''function getStageBucket(root,key){\n return root[key]||(root[key]={});\n}\nasync function fetchOne(src,s,force=false){\n const key=s.key;\n const stageCache=getStageBucket(cache,key);\n const stagePending=getStageBucket(pending,key);\n if(force){delete stageCache[src.id];delete stagePending[src.id]}\n if(stageCache[src.id])return stageCache[src.id];\n if(stagePending[src.id])return stagePending[src.id];\n stagePending[src.id]=fetchSource(src,s)\n   .then(data=>({src,data,ok:true}))\n   .catch(error=>({src,error,ok:false}))\n   .then(result=>{\n     stageCache[src.id]=result;\n     delete stagePending[src.id];\n     return result;\n   });\n return stagePending[src.id];\n}\nfunction fetchedResults(s){\n const stageCache=cache[s.key]||{};\n return [...MODELS,BEST].map(src=>stageCache[src.id]).filter(Boolean);\n}\nfunction isResultPending(s,id){\n return !!(pending[s.key]&&pending[s.key][id]);\n}\nfunction anyDeterministicPending(s){\n return [...MODELS,BEST].some(src=>isResultPending(s,src.id));\n}\nasync function fetchAllProgressive(s,force=false,onUpdate=null){\n const key=s.key;\n if(force){delete cache[key];delete pending[key]}\n getStageBucket(cache,key);\n getStageBucket(pending,key);\n if(onUpdate)onUpdate(fetchedResults(s),null);\n const jobs=[...MODELS,BEST].map(src=>\n   fetchOne(src,s,false).then(result=>{\n     if(onUpdate)onUpdate(fetchedResults(s),result);\n     return result;\n   })\n );\n await Promise.all(jobs);\n return fetchedResults(s);\n}'''
          s=s.replace(old,new,1)
          # Replace showWeather with progressive rendering block from tested v30/v33
          start=s.index('async function showWeather(s,force,token){')
          end=s.index('\nfunction initMap(){',start)
          replacement=Path('.github/workflows/showweather-v33.txt').read_text(encoding='utf-8') if Path('.github/workflows/showweather-v33.txt').exists() else None
          if replacement is None:
              raise SystemExit('showweather helper missing')
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update weather app to mobile v33"
          git push
