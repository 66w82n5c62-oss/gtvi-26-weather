name: Publish v87 preview
on:
  push:
    paths:
      - '.github/workflows/publish-v87.yml'
      - '.github/v87-builder.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build and check
        run: |
          python3 .github/v87-builder.py
          python3 - <<'PY' > /tmp/v87-check.js
          import re
          s=open('preview-v87.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/v87-check.js
          grep -q 'Mobile v87 Preview' preview-v87.html
          grep -q 'font-size:10px' preview-v87.html
          grep -q 'consensusPrecipCondition' preview-v87.html
          grep -q 'Heavy showers' preview-v87.html
          grep -q 'Moderate rain' preview-v87.html
          ! grep -Eq '☀️|☀|🌤️|⛅|🌞|🌥️|🌦️' preview-v87.html
      - name: Publish preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v87.html
          git commit -m 'Publish v87 rain intensity and time-field preview'
          git push origin main
