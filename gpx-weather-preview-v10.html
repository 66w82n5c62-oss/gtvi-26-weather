  if(!page.includes(marker))throw new Error('v10 build anchor not found');
  const patch="\nconst mr=(needle,replacement,label)=>{\n  if(!html.includes(needle))throw new Error(\"Weather engine \"+label+\" anchor not found\");\n  html=html.replace(needle,replacement);\n};\nmr(\n 'document.getElementById(\"stageLabel\").textContent=\"Weather for the day\";',\n 'document.getElementById(\"stageLabel\").textContent=isHistoricalStage(s)?\"Historical weather for the day\":\"Weather for the day\";',\n \"historical day heading\"\n);\nmr(\n 'function forecastSnapshot(bundles,s){',\n `function historicalPointRange(b){\n const rs=b.forecasts.filter(Boolean);\n const vals=k=>rs.map(r=>r[k]).filter(Number.isFinite);\n const range=(v,d,suffix)=>{\n  if(!v.length)return \"\\u2014\";\n  const lo=Math.min(...v),hi=Math.max(...v),fmt=x=>d?x.toFixed(d):String(Math.round(x));\n  return (Math.abs(hi-lo)<1e-9?fmt(lo):fmt(lo)+\"\\u2013\"+fmt(hi))+suffix;\n };\n const t=vals(\"temp\"),w=vals(\"wind\"),g=vals(\"gust\"),p=vals(\"precip\");\n const wetYears=p.filter(v=>v>=0.2).length;\n return {\n  temp:range(t,0,\"\\u00b0\"),\n  wind:range(w,0,\" km/h\"),\n  gust:\"gust \"+range(g,0,\" km/h\"),\n  rainYears:p.length?wetYears+\"/\"+p.length+\" wet\":\"\\u2014\",\n  rainAmount:p.length?\"rain \"+range(p,1,\" mm/h\\"):\"\",\n  years:rs.map(r=>historicalAnalogueYear(r.source)).filter(Number.isFinite).join(\"/\")\n };\n}\nfunction forecastSnapshot(bundles,s){`,\n \"historical point range helper\"\n);\nmr(\n 'windEffect=windEffectLabel(routeBearing,meanWindDir,wind);',\n 'windEffect=windEffectLabel(routeBearing,meanWindDir,wind);const hr=isHistoricalStage(s)?historicalPointRange(b):null;',\n \"historical point range binding\"\n);\nmr(\n '<span class=\"pointMetricValue\">${meanT}\\u00b0</span>',\n '<span class=\"pointMetricValue\">${hr?hr.temp:meanT+\"\\\\u00b0\"}</span>',\n \"historical temperature range\"\n);\nmr(\n '<span class=\"pointMetricValue ${cclass}\">${prob==null?\"\\u2014\":Math.round(prob)+\"%\"}</span>',\n '<span class=\"pointMetricValue ${cclass}\">${hr?hr.rainYears:(prob==null?\"\\\\u2014\":Math.round(prob)+\"%\")}</span>',\n \"historical rain frequency\"\n);\nmr(\n '<span class=\"pointMetricValue\">${wind} km/h</span>',\n '<span class=\"pointMetricValue\">${hr?hr.wind:wind+\" km/h\"}</span>',\n \"historical wind range\"\n);\nmr(\n '<div class=\"pointGust\">gust ${gust} km/h</div>${windEffect?',\n '<div class=\"pointGust\">${hr?hr.gust:\"gust \"+gust+\" km/h\"}</div>${hr&&hr.rainAmount?`<div class=\"pointGust\">${hr.rainAmount}</div>`:\"\"}${windEffect?',\n \"historical gust and rain range\"\n);\nmr(\n '<details><summary>${b.conf.label.replace(\" forecast consensus\",\" consensus\")} \\u00b7 show detail</summary>',\n '<details${hr?\" open\":\"\"}><summary>${hr?(\"Historical range \\\\u00b7 \"+hr.years):(b.conf.label.replace(\" forecast consensus\",\" consensus\")+\" \\\\u00b7 show detail\")}</summary>',\n \"historical expanded detail\"\n);\nmr(\n 'ag.className=\"agree \"+headlineConsensus;',\n 'ag.className=isHistoricalStage(s)?\"agree medium\":\"agree \"+headlineConsensus;',\n \"historical headline badge class\"\n);\nmr(\n 'ag.textContent=\"Current forecast consensus: \"+headlineConsensus.charAt(0).toUpperCase()+headlineConsensus.slice(1);',\n 'ag.textContent=isHistoricalStage(s)?(loadedModels+\" historical analogues\"):(\"Current forecast consensus: \"+headlineConsensus.charAt(0).toUpperCase()+headlineConsensus.slice(1));',\n \"historical headline badge text\"\n);\nmr(\n 'document.getElementById(\"explain\").textContent=headlineConsensus===\"high\"?\"The main forecasts tell a similar story along the route.\":\"\";',\n 'document.getElementById(\"explain\").textContent=isHistoricalStage(s)?\"Along-the-way cards show the observed range across the analogue years.\":(headlineConsensus===\"high\"?\"The main forecasts tell a similar story along the route.\":\"\");',\n \"historical explanatory text\"\n);\nmr(\n 'ag.textContent=\"Loading forecast consensus\";',\n 'ag.textContent=isHistoricalStage(s)?\"Loading historical analogues\":\"Loading forecast consensus\";',\n \"historical loading badge\"\n);\nmr(\n 'document.getElementById(\"mRainSub\").textContent=\"highest route-point consensus\";',\n 'document.getElementById(\"mRainSub\").textContent=isHistoricalStage(s)?\"wet-year frequency at the wettest route point\":\"highest route-point consensus\";',\n \"historical rain subtitle\"\n);\n";
  page=page.replace(marker,patch+'\n'+marker);
