<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081522">
<title>GTVI 26 Weather App · Mobile v95 Preview</title>
<style>
html,body{margin:0;min-height:100%;background:#081522;color:#f4f8fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{padding:24px;text-align:center;color:#bac9d6;font-size:14px}
</style>
</head>
<body>
<div id="boot">Loading GTVI 26 Weather App v95…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./preview-v94.html?v=94-3',{cache:'no-store'});
    if(!r.ok) throw new Error('Could not load v94 preview base ('+r.status+')');
    let src=await r.text();

    // Inject only the v95 cloud-size refinements into v94's already-built inner app.
    const marker='    document.open();\n    document.write(html);';
    const patch=`    // v95: slightly stronger cloudy / partly-cloudy silhouettes; bicycle-wheel sun itself remains unchanged.\n    const v95CloudCss=\`\n/* v95 cloud sizing */\n.cycleSunIcon.hasCloud .cycleCloud{transform:translate(-1.5px,-1px) scale(1.12);transform-origin:34px 32px;}\n.v95CloudOnly{display:inline-block;font-size:34px;line-height:1;vertical-align:middle;}\n.v94IconKeyGlyph .v95CloudOnly{font-size:38px;}\n@media(max-width:370px){.wxIcon .v95CloudOnly{font-size:31px;}}\n\`;\n    html=html.replace('</style>',v95CloudCss+'</style>');\n    html=html.replace('c<=2?cycleSunIcon(true):\"☁️\";','c<=2?cycleSunIcon(true):\'<span class=\"v95CloudOnly\">☁️</span>\';');\n    html=html.replace('return {icon:\"☁️\",label:\"Mostly cloudy\"};','return {icon:\'<span class=\"v95CloudOnly\">☁️</span>\',label:\"Mostly cloudy\"};');\n\n    document.open();\n    document.write(html);`;
    if(!src.includes(marker)) throw new Error('v94 injection point not found');
    src=src.replace(marker,patch);
    src=src.replaceAll('Mobile v94 Preview','Mobile v95 Preview');
    src=src.replaceAll('GTVI 26 Weather App v94','GTVI 26 Weather App v95');
    src=src.replaceAll('v94 weather icon preview','v95 weather icon preview');

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.getElementById('boot').textContent='Unable to load v95 preview: '+err.message;
  }
})();
</script>
</body>
</html>
