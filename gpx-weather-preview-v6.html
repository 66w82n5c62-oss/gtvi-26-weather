<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081522">
<title>GPX Route Weather · Preview v6</title>
<style>
html,body{margin:0;background:#081522;color:#f4f8fc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:24px}.loading{max-width:760px;margin:auto;color:#bac9d6;font-size:13px}
</style>
</head>
<body>
<div class="loading">Loading GPX Route Weather v6…</div>
<script>
(async()=>{
 try{
  const r=await fetch('./gpx-weather-preview-v4.html?v=4',{cache:'no-store'});
  if(!r.ok)throw new Error('Could not load v4 base ('+r.status+')');
  let html=await r.text();

  html=html.replaceAll('Preview v4','Preview v6');
  html=html.replaceAll('GPX Preview v4','GPX Preview v6');
  html=html.replaceAll('gpx_route_weather_v4_','gpx_route_weather_v6_');

  const badLive='const url=\\`${src.endpoint}?latitude=\\${lat}&longitude=\\${lon}&elevation=\\${elevation}&hourly=\\${hourly}&timezone=auto&start_date=\\${s.date}&end_date=\\${end}\\`;';
  const goodLive='const url=\\`\\${src.endpoint}?latitude=\\${lat}&longitude=\\${lon}&elevation=\\${elevation}&hourly=\\${hourly}&timezone=auto&start_date=\\${s.date}&end_date=\\${end}\\`;';
  if(!html.includes(badLive) && !html.includes(goodLive))throw new Error('v6 live forecast anchor not found');
  html=html.replace(badLive,goodLive);

  const oldSpan='const analogueYear=historicalAnalogueYear(src),histDate=String(analogueYear)+s.date.slice(4),histEnd=addDaysISO(histDate,1),targetEnd=addDaysISO(s.date,1);';
  const newSpan='const analogueYear=historicalAnalogueYear(src),histDate=String(analogueYear)+s.date.slice(4),histDays=Math.max(2,Math.ceil(s.distance/10/24)+3),histEnd=addDaysISO(histDate,histDays);';
  if(!html.includes(oldSpan))throw new Error('v6 historical date-range anchor not found');
  html=html.replace(oldSpan,newSpan);

  const oldMap='data.forEach(o=>{if(o&&o.hourly&&Array.isArray(o.hourly.time))o.hourly.time=o.hourly.time.map(t=>String(t).replace(histDate,s.date).replace(histEnd,targetEnd));});';
  const newMap='const dayShift=Math.round((Date.parse(s.date+"T12:00:00Z")-Date.parse(histDate+"T12:00:00Z"))/86400000);\n  data.forEach(o=>{if(o&&o.hourly&&Array.isArray(o.hourly.time))o.hourly.time=o.hourly.time.map(t=>{const z=String(t),m=z.match(/^(\\d{4}-\\d{2}-\\d{2})(.*)$/);return m?addDaysISO(m[1],dayShift)+m[2]:z;});});';
  if(!html.includes(oldMap))throw new Error('v6 historical timeline anchor not found');
  html=html.replace(oldMap,newMap);

  document.open();document.write(html);document.close();
 }catch(e){
  document.body.innerHTML='<div class="loading" style="color:#ffc1b1">'+String(e.message||e)+'</div>';
 }
})();
</script>
</body>
</html>
