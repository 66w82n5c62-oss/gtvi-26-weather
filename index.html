<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081522">
<title>GTVI 26 Weather App · Mobile v91</title>
<style>
html,body{margin:0;min-height:100%;background:#081522;color:#f4f8fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{padding:24px;text-align:center;color:#bac9d6;font-size:14px}
</style>
</head>
<body>
<div id="boot">Loading GTVI 26 Weather App v91…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./preview-v90.html?v=90-1',{cache:'no-store'});
    if(!r.ok) throw new Error('Could not load v90 base ('+r.status+')');
    let html=await r.text();

    // v91 live: retain v90 visuals and behaviour, but remove bicycle interaction audio.
    html=html.replaceAll('playGearShiftSound();','');
    html=html.replace(
      'function playGearShiftSound(){',
      'function playGearShiftSound(){ return; /* v91: interaction audio removed */'
    );

    html=html.replaceAll('Mobile v90 Preview','Mobile v91');
    html=html.replaceAll('Mobile v90','Mobile v91');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').textContent='Unable to load GTVI 26 Weather App v91: '+err.message;
  }
})();
</script>
</body>
</html>
